<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《扶摇携卿踏景云》· 互动影游试玩</title>
<style>
  :root {
    --brick: #b5443c;
    --brick-dark: #8e332d;
    --cream: #faf6f0;
    --ink: #2b2320;
    --gold: #d4b078;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .stage { max-width: 860px; width: 100%; }
  .stage h1 {
    font-size: 20px; text-align: center; margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .stage .subtitle {
    text-align: center; font-size: 13px; color: #8a7a70; margin-bottom: 16px;
  }
  .player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(43,35,32,.18);
  }
  video { width: 100%; height: 100%; object-fit: contain; }

  /* 选项浮层 */
  .choice-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.85) 35%, rgba(0,0,0,.3) 75%, transparent);
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    padding: 28px 24px 28px;
    gap: 12px;
    animation: fadeUp .35s ease;
  }
  .choice-overlay.show { display: flex; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px);} to { opacity: 1; transform: none; } }
  .choice-question {
    color: #fff; font-size: 17px; font-weight: 600; line-height: 1.5;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    margin-bottom: 4px;
  }
  .choice-btn {
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: transform .15s ease, background .15s ease;
    font-family: inherit;
    line-height: 1.5;
  }
  .choice-btn:hover { background: #fff; transform: translateY(-2px); }
  .choice-btn .tag {
    display: inline-block; font-size: 11px; color: var(--brick);
    border: 1px solid var(--brick); border-radius: 4px;
    padding: 1px 6px; margin-right: 8px; vertical-align: 1px;
  }
  .choice-btn .gains {
    display: block; font-size: 12px; color: #9a7b4f; margin-top: 4px;
  }
  /* 结局面板 */
  .ending-panel {
    position: absolute; inset: 0;
    background: rgba(18,12,10,.9);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 32px 40px;
    color: #fff;
  }
  .ending-panel.show { display: flex; animation: fadeUp .4s ease; }
  .ending-panel .end-title { font-size: 22px; letter-spacing: 4px; color: var(--gold); }
  .ending-panel .end-quote {
    font-size: 15px; line-height: 2; color: rgba(255,255,255,.92);
    max-width: 560px;
  }
  .ending-panel .end-gains {
    font-size: 12px; color: var(--gold); letter-spacing: 1px;
  }
  .ending-panel .end-path {
    font-size: 12px; color: rgba(255,255,255,.55); line-height: 1.9;
  }
  .cta-btn {
    background: var(--brick);
    color: #fff; border: none; border-radius: 24px;
    padding: 13px 32px; font-size: 15px; letter-spacing: 1px;
    cursor: pointer; text-decoration: none;
    transition: background .15s ease;
  }
  .cta-btn:hover { background: var(--brick-dark); }
  .restart-btn {
    background: transparent; color: rgba(255,255,255,.7);
    border: 1px solid rgba(255,255,255,.35); border-radius: 24px;
    padding: 10px 28px; font-size: 13px; cursor: pointer;
  }
  /* 播放条 */
  .hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .hud .node-name {
    font-size: 12px; color: rgba(255,255,255,.88);
    background: rgba(0,0,0,.5);
    padding: 4px 12px; border-radius: 20px;
    backdrop-filter: blur(4px);
  }
  .hud .drama-name { margin-left: auto; font-size: 12px; color: rgba(255,255,255,.65); text-shadow: 0 1px 4px #000; }
  /* 强制跳转提示 */
  .transition-tip {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: #000; color: rgba(255,255,255,.85);
    font-size: 15px; letter-spacing: 6px;
  }
  .transition-tip.show { display: flex; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .hint {
    margin-top: 12px; font-size: 12px; color: #a3948a; text-align: center; line-height: 1.7;
  }
  /* 点击开始遮罩（浏览器拦截自动播放时的兜底） */
  .tap-play {
    position: absolute; inset: 0; z-index: 6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: rgba(0,0,0,.45); cursor: pointer;
  }
  .tap-play.hide { display: none; }
  .tap-play .play-icon {
    width: 68px; height: 68px; border-radius: 50%;
    background: rgba(255,255,255,.94); color: var(--brick);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; padding-left: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .tap-play .play-text {
    color: #fff; font-size: 14px; letter-spacing: 3px; text-shadow: 0 2px 6px #000;
  }
</style>
</head>
<body>
<div class="stage">
  <h1>《扶摇携卿踏景云》· 互动影游试玩</h1>
  <div class="subtitle">你是镇国长公主萧玉卿 —— 你的选择，决定大周的命运</div>

  <div class="player-wrap" id="playerWrap">
    <video id="video" playsinline preload="metadata" controls></video>

    <div class="hud">
      <span class="node-name" id="nodeName">NODE_001 · 夜宴</span>
      <span class="drama-name">扶摇携卿踏景云</span>
    </div>

    <div class="transition-tip" id="transitionTip">当 夜 · 书 房</div>

    <div class="tap-play" id="tapPlay">
      <div class="play-icon">▶</div>
      <div class="play-text">点击开始试玩</div>
    </div>

    <div class="choice-overlay" id="choiceOverlay">
      <div class="choice-question" id="choiceQuestion"></div>
      <div id="choiceButtons"></div>
    </div>

    <div class="ending-panel" id="endingPanel">
      <div class="end-title" id="endTitle"></div>
      <div class="end-quote" id="endQuote"></div>
      <div class="end-path" id="endPath"></div>
      <a class="cta-btn" id="ctaBtn" href="#" target="_blank">免费看正片 · 扶摇携卿踏景云</a>
      <button class="restart-btn" id="restartBtn">换个选择再玩一次</button>
    </div>
  </div>

  <div class="hint">
    改编自短剧《扶摇携卿踏景云》前 3 集免费剧情 · 结局分支与后续章节将随正片持续更新
  </div>
</div>

<script>
// ============ 分支剧本配置（唯一需要改的地方） ============
// 节点: id / label / src / start / end / next(强制跳转) / choice{time,question,options} / ending{title,quote}
// 素材: 前两段为已上线剧免费部分实拍剪辑；分支结局以剧本台词收束 + 引流正片
const SEGMENTS = {
  n1: {
    label: "NODE_001 · 夜宴惊变",
    src: "clips/node001.mp4",
    start: 0,
    end: 149,                      // 播完整段宴席戏（降封号→萧瑾辱骂→拔剑劈案→挑起林瑶下巴）
    next: "n2",                    // 强制节点，播完直接跳转 NODE_002
    tip: "当 夜 · 林 府 书 房",
  },
  n2: {
    label: "NODE_002 · 书房对峙",
    src: "clips/node002.mp4",
    start: 0,
    end: 112,
    choice: {
      time: 108,                   // 剧本触发时机：萧玉卿翻完账册、向林瑶伸出手
      question: "萧玉卿向林瑶伸出右手——",
      options: [
        { tag: "A", text: "“跟我走，让男人看看，女人的算盘能算天下账。”",
          gains: "女性觉醒 +20 ｜ 林瑶好感 +20",
          next: "endA02" },
        { tag: "B", text: "“长公主府给你百倍利润，助我清查贪官。”",
          gains: "商业财力 +30 ｜ 林瑶好感 +5",
          next: "endA03" },
      ],
    },
  },
  // —— 分支结局（免费部分到此为止，用剧本台词收束并引流正片）——
  endA02: {
    label: "结局 · 破笼同盟",
    ending: {
      title: "同盟 · 破笼",
      quote: "林瑶握住那只手，破涕为笑：“好，我跟你走。但殿下要答应我——将来有一天，让我亲手跟那些抢我东西的人，把账一笔笔算清！”\n萧玉卿唇角微扬，语气森冷：“放心。到那时，我替你把他们的手，一只一只剁下。”",
    },
  },
  endA03: {
    label: "结局 · 利益同盟",
    ending: {
      title: "同盟 · 交契",
      quote: "林瑶果断伸手，眼中闪过商人的精明：“殿下是个爽快人。从今往后，我的商铺就是殿下的钱袋子。但我的账目，只认长公主的令，不认皇上的印。”\n萧玉卿冷酷一笑：“正合我意。户部欠你的，我会连本带利让他们吐出来。”",
    },
  },
};
// 正片引流链接（《扶摇携卿踏景云》抖音分享链接，2026-09-04 娘娘提供）
const CTA_URL = "https://v.douyin.com/JX4tAxLxChY/";

// ============ 播放器逻辑 ============
const video = document.getElementById("video");
const overlay = document.getElementById("choiceOverlay");
const questionEl = document.getElementById("choiceQuestion");
const buttonsEl = document.getElementById("choiceButtons");
const endingEl = document.getElementById("endingPanel");
const endTitleEl = document.getElementById("endTitle");
const endQuoteEl = document.getElementById("endQuote");
const endPathEl = document.getElementById("endPath");
const nodeNameEl = document.getElementById("nodeName");
const ctaBtn = document.getElementById("ctaBtn");
const tipEl = document.getElementById("transitionTip");
const tapPlay = document.getElementById("tapPlay");

let currentId = "n1";
let currentDur = 0;
let trail = [];
let ended = false;

// 播放尝试：成功则隐藏点击遮罩，失败（浏览器拦截自动播放）则显示遮罩等用户点
function tryPlay() {
  video.play().then(() => {
    tapPlay.classList.add("hide");
  }).catch(() => {
    tapPlay.classList.remove("hide");
  });
}
tapPlay.addEventListener("click", () => { tryPlay(); });

function loadNode(id, skipTip) {
  const node = SEGMENTS[id];
  if (!node) return;
  currentId = id;
  ended = false;
  currentDur = 0;
  overlay.classList.remove("show");
  endingEl.classList.remove("show");
  nodeNameEl.textContent = node.label;

  // 结局节点没有视频，直接展示结局面板
  if (node.ending && !node.src) {
    tapPlay.classList.add("hide");
    showEnding(node);
    return;
  }

  const doLoad = () => {
    video.src = node.src;
    video.currentTime = node.start || 0;
    tryPlay();
  };

  // 强制节点跳转时，先放一个黑场转场卡
  if (node.tip && !skipTip) {
    tipEl.textContent = node.tip;
    tipEl.classList.add("show");
    setTimeout(() => { tipEl.classList.remove("show"); doLoad(); }, 1200);
  } else {
    doLoad();
  }
}

video.addEventListener("loadedmetadata", () => {
  currentDur = video.duration || 0;
});

video.addEventListener("timeupdate", () => {
  const node = SEGMENTS[currentId];
  if (!node || ended) return;
  const t = video.currentTime;

  // 选项触发点：不能超过视频实际时长
  if (node.choice && !overlay.classList.contains("show") &&
      node.choice.time && t >= node.choice.time &&
      (!currentDur || node.choice.time < currentDur - 0.2)) {
    ended = true;
    video.pause();
    showChoices(node.choice);
    return;
  }
  // 节点结束点：取配置值与实际时长中较小的一个
  const endT = node.end
    ? (currentDur ? Math.min(node.end, currentDur - 0.15) : node.end)
    : (currentDur ? currentDur - 0.05 : 0);
  if (endT && t >= endT) {
    ended = true;
    if (node.ending) { showEnding(node); return; }
    if (node.next) { loadNode(node.next); return; }
    if (node.choice) { video.pause(); showChoices(node.choice); }
  }
});

// 兜底：视频自然播完（timeupdate 可能来不及触发）
video.addEventListener("ended", () => {
  const node = SEGMENTS[currentId];
  if (!node || ended) return;
  ended = true;
  if (node.ending) { showEnding(node); return; }
  if (node.next) { loadNode(node.next); return; }
  if (node.choice) { showChoices(node.choice); }
});

function showChoices(choice) {
  questionEl.textContent = choice.question;
  buttonsEl.innerHTML = "";
  choice.options.forEach((opt) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = '<span class="tag">' + opt.tag + "</span>" + opt.text;
    btn.onclick = () => {
      trail.push(opt.tag + "：" + opt.text);
      loadNode(opt.next, true);
    };
    buttonsEl.appendChild(btn);
  });
  overlay.classList.add("show");
}

function showEnding(node) {
  const e = node.ending;
  video.pause();
  endTitleEl.textContent = e.title;
  endQuoteEl.innerHTML = (e.quote || "").split("\n").map(s => "<p style='margin:4px 0'>" + s + "</p>").join("");
  endPathEl.innerHTML = "你的路线：" + (trail.length ? trail.join("<br>") : "——");
  ctaBtn.href = CTA_URL;
  endingEl.classList.add("show");
}

document.getElementById("restartBtn").onclick = () => { trail = []; loadNode("n1"); };

video.addEventListener("error", () => {
  nodeNameEl.textContent = "⚠️ 视频加载失败";
});

loadNode("n1");
</script>
</body>
</html>
