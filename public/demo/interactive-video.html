<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互动影游 · 《扶摇携卿踏景云》试玩</title>
<style>
  :root {
    --brick: #b5443c;
    --brick-dark: #8e332d;
    --cream: #faf6f0;
    --ink: #2b2320;
    --gold: #c9a06a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .stage { max-width: 480px; width: 100%; }
  .stage h1 {
    font-size: 20px; text-align: center; margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .stage .subtitle {
    text-align: center; font-size: 13px; color: #8a7a70; margin-bottom: 16px;
  }
  .player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(43,35,32,.18);
  }
  video { width: 100%; height: 100%; object-fit: cover; }

  /* 选项浮层 */
  .choice-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.82) 30%, rgba(0,0,0,.25) 70%, transparent);
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    padding: 28px 20px 32px;
    gap: 12px;
    animation: fadeUp .35s ease;
  }
  .choice-overlay.show { display: flex; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px);} to { opacity: 1; transform: none; } }
  .choice-question {
    color: #fff; font-size: 17px; font-weight: 600; line-height: 1.5;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    margin-bottom: 4px;
  }
  .choice-btn {
    background: rgba(255,255,255,.92);
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: transform .15s ease, background .15s ease;
    font-family: inherit;
  }
  .choice-btn:hover { background: #fff; transform: translateY(-2px); }
  .choice-btn .tag {
    display: inline-block; font-size: 11px; color: var(--brick);
    border: 1px solid var(--brick); border-radius: 4px;
    padding: 1px 6px; margin-right: 8px; vertical-align: 1px;
  }
  /* 结局面板 */
  .ending-panel {
    position: absolute; inset: 0;
    background: rgba(20,14,12,.88);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 32px;
    color: #fff;
  }
  .ending-panel.show { display: flex; animation: fadeUp .4s ease; }
  .ending-panel .end-title { font-size: 22px; letter-spacing: 4px; color: var(--gold); }
  .ending-panel .end-path {
    font-size: 13px; color: rgba(255,255,255,.75); line-height: 1.9;
    max-height: 120px; overflow: auto;
  }
  .cta-btn {
    background: var(--brick);
    color: #fff; border: none; border-radius: 24px;
    padding: 13px 32px; font-size: 15px; letter-spacing: 1px;
    cursor: pointer; text-decoration: none;
    transition: background .15s ease;
  }
  .cta-btn:hover { background: var(--brick-dark); }
  .restart-btn {
    background: transparent; color: rgba(255,255,255,.7);
    border: 1px solid rgba(255,255,255,.35); border-radius: 24px;
    padding: 10px 28px; font-size: 13px; cursor: pointer;
  }
  /* 播放条 */
  .hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .hud .node-name {
    font-size: 11px; color: rgba(255,255,255,.85);
    background: rgba(0,0,0,.45);
    padding: 4px 10px; border-radius: 20px;
    backdrop-filter: blur(4px);
  }
  .hud .drama-name { margin-left: auto; font-size: 11px; color: rgba(255,255,255,.6); }
  .hint {
    margin-top: 12px; font-size: 12px; color: #a3948a; text-align: center; line-height: 1.7;
  }
</style>
</head>
<body>
<div class="stage">
  <h1>《扶摇携卿踏景云》· 互动试玩</h1>
  <div class="subtitle">你的选择，决定她的命运</div>

  <div class="player-wrap" id="playerWrap">
    <video id="video" playsinline preload="metadata"></video>

    <div class="hud">
      <span class="node-name" id="nodeName">开场</span>
      <span class="drama-name">扶摇携卿踏景云</span>
    </div>

    <div class="choice-overlay" id="choiceOverlay">
      <div class="choice-question" id="choiceQuestion"></div>
      <div id="choiceButtons"></div>
    </div>

    <div class="ending-panel" id="endingPanel">
      <div class="end-title">未 完 待 续</div>
      <div class="end-path" id="endPath"></div>
      <a class="cta-btn" id="ctaBtn" href="#" target="_blank">去红果免费看正片</a>
      <button class="restart-btn" id="restartBtn">换个选择再玩一次</button>
    </div>
  </div>

  <div class="hint">
    ⚠️ 当前为骨架预览：视频为占位样片，分支节点与文案待替换正式素材。<br>
    正式版只需替换 SEGMENTS 配置里的视频地址与节点时间。
  </div>
</div>

<script>
// ============ 分支剧本配置（唯一需要改的地方） ============
// 每个节点: id / label(节点名) / src(视频地址) / start(起点秒) / end(结束秒) / choice(到点弹选项) / ending(是否结局面板)
// 当前片段为样片占位剪辑（H.264 已转码）；正式素材到位后替换 clips/ 下同名文件即可
const SEGMENTS = {
  start: {
    label: "开场 · 第1集",
    src: "clips/seg-start.mp4",         // ← 占位片段，正式替换为《扶摇》免费片段
    start: 0,
    end: 7,
    choice: {
      time: 5,                           // ← 播到第5秒弹选项（正式版对准剧情钩子）
      question: "「此刻，你会怎么选？」",
      options: [
        { tag: "A", text: "隐忍不发，静待时机", next: "pathA" },
        { tag: "B", text: "当场掀桌，绝不低头", next: "pathB" },
      ],
    },
  },
  pathA: {
    label: "支线 A · 隐忍",
    src: "clips/seg-a.mp4",
    start: 0,
    end: 7,
    choice: {
      time: 5,
      question: "「他伸出了手，握，还是不握？」",
      options: [
        { tag: "A", text: "握住这只手，赌一次", next: "endTrue" },
        { tag: "B", text: "转身离开，只信自己", next: "endAlone" },
      ],
    },
  },
  pathB: {
    label: "支线 B · 掀桌",
    src: "clips/seg-b.mp4",
    start: 0,
    end: 7,
    choice: {
      time: 5,
      question: "「摊牌之后，退还是进？」",
      options: [
        { tag: "A", text: "乘胜追击，逼他表态", next: "endTrue" },
        { tag: "B", text: "留一步余地，以退为进", next: "endAlone" },
      ],
    },
  },
  endTrue: {
    label: "结局 · 双向奔赴",
    src: "clips/seg-end1.mp4",
    start: 0,
    end: 5,
    ending: { title: "结局 · 并肩看景云", cta: "去红果免费看正片" },
  },
  endAlone: {
    label: "结局 · 独行",
    src: "clips/seg-end2.mp4",
    start: 0,
    end: 5,
    ending: { title: "结局 · 她自己就是景云", cta: "去红果免费看正片" },
  },
};
// 正式版改这里：上线平台跳转链接
const CTA_URL = "https://hongguo.douyin.com/";  // ← 待替换为《扶摇携卿踏景云》红果详情页链接

// ============ 播放器逻辑 ============
const video = document.getElementById("video");
const overlay = document.getElementById("choiceOverlay");
const questionEl = document.getElementById("choiceQuestion");
const buttonsEl = document.getElementById("choiceButtons");
const endingEl = document.getElementById("endingPanel");
const endPathEl = document.getElementById("endPath");
const nodeNameEl = document.getElementById("nodeName");
const ctaBtn = document.getElementById("ctaBtn");
const wrap = document.getElementById("playerWrap");

let currentId = "start";
let trail = [];      // 记录走过的路径
let paused = false;  // 选项浮层是否弹出

function loadNode(id) {
  const node = SEGMENTS[id];
  if (!node) return;
  currentId = id;
  paused = false;
  overlay.classList.remove("show");
  endingEl.classList.remove("show");
  nodeNameEl.textContent = node.label;
  video.src = node.src + "#t=" + node.start;
  video.currentTime = node.start;
  video.play().catch(() => {});
}

video.addEventListener("timeupdate", () => {
  const node = SEGMENTS[currentId];
  if (!node || paused) return;
  // 到达选项点
  if (node.choice && video.currentTime >= node.choice.time) {
    paused = true;
    video.pause();
    showChoices(node.choice);
  }
  // 播完进入结局或兜底
  if (video.currentTime >= node.end) {
    if (node.ending) showEnding(node.ending);
    else if (node.choice) { paused = true; video.pause(); showChoices(node.choice); }
  }
});

function showChoices(choice) {
  questionEl.textContent = choice.question;
  buttonsEl.innerHTML = "";
  choice.options.forEach((opt) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = '<span class="tag">' + opt.tag + "</span>" + opt.text;
    btn.onclick = () => {
      trail.push(opt.tag + " · " + opt.text);
      loadNode(opt.next);
    };
    buttonsEl.appendChild(btn);
  });
  overlay.classList.add("show");
}

function showEnding(ending) {
  paused = true;
  video.pause();
  ctaBtn.textContent = ending.cta;
  ctaBtn.href = CTA_URL;
  endPathEl.innerHTML = "你走过的路：<br>" + (trail.length ? trail.join("<br>") : "直达结局");
  endingEl.classList.add("show");
}

document.getElementById("restartBtn").onclick = () => { trail = []; loadNode("start"); };

// 占位样片循环到下一段时兜底：出错不卡死
video.addEventListener("error", () => {
  nodeNameEl.textContent = "⚠️ 视频加载失败（占位素材缺失）";
});

loadNode("start");
</script>
</body>
</html>
